[tools]
go = "1.25.7"
"github:lucasew/workspaced" = "0.2.1"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]
run = "go test ./..."

[tasks.codegen]
depends = ["codegen:*"]
run = "go generate ./..."

[tasks.install]
depends = ["install:*"]
run = "go mod download"

[tasks.ci]
depends = ["lint", "test"]

[tasks."install:dummy"]
hide = true

[tasks."test:dummy"]
hide = true

[tasks."codegen:dummy"]
hide = true
