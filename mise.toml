[tools]
go = "1.25.7"
"github:lucasew/workspaced" = "0.2.1"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:go"]
run = "go test ./..."

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:go"]
run = "go generate ./..."

[tasks.install]
depends = ["install:*"]

[tasks."install:go"]
run = "go mod download"

[tasks.ci]
depends = ["lint", "test"]
